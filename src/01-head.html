<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>21 Knots</title>
<meta name="description" content="21 Knots is a design, engineering and consulting firm serving the global maritime and oil & gas industry. Ship design, offshore engineering, green retrofits and on-site services from India, Singapore and the UAE.">
<meta name="theme-color" content="#ffffff">
<meta name="referrer" content="strict-origin-when-cross-origin">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300..800;1,9..40,300..800&display=swap" rel="stylesheet">
<style>
/* ==========================================================================
   21 KNOTS — design tokens
   Layout idea: a 12-column editorial grid, left-aligned, generous white;
   one bold moment (the hero wake field) and quiet, precise type everywhere else.
   ========================================================================== */
:root {
  /* colour — one brand blue, blue-biased neutrals */
  --brand: #1A7F99;          /* 21 Knots blue, from the logo (#259BB5) deepened to pass AA with white text */
  --brand-logo: #259BB5;     /* exact logo blue, for decoration */
  --mint: #6BC6B0;           /* logo "knots" green, used sparingly */
  --brand-deep: #135F73;
  --brand-tint: #E6F3F6;
  --ink: #0B1D26;            /* text, teal-biased near-black */
  --ink-2: #485C66;          /* secondary text */
  --ink-3: #85989F;          /* tertiary, captions */
  --line: #DCE6EA;           /* hairlines */
  --wash: #F2F7F8;           /* quiet panels */
  --paper: #FFFFFF;

  /* type */
  --font: "DM Sans", ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --fs-display: clamp(2.9rem, 6.5vw, 7.4rem);
  --fs-h1: clamp(2.6rem, 6vw, 6rem);
  --fs-h2: clamp(2.1rem, 4.4vw, 4.25rem);
  --fs-h3: clamp(1.35rem, 1.9vw, 1.75rem);
  --fs-lead: clamp(1.25rem, 2.1vw, 1.875rem);
  --fs-body: 1.0625rem;
  --fs-small: 0.875rem;
  --fs-micro: 0.78rem;

  /* space + shape */
  --gutter: clamp(20px, 4vw, 56px);
  --max: 1440px;
  --section: clamp(96px, 13vw, 200px);
  --r-sm: 6px;
  --r-md: 14px;
  --r-lg: 28px;

  /* motion */
  --ease-out: cubic-bezier(.16, 1, .3, 1);
  --ease-io: cubic-bezier(.76, 0, .24, 1);
  --nav-h: 76px;

  color-scheme: light;
}

/* ---------- reset ---------- */
*, *::before, *::after { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--paper);
  color: var(--ink);
  font-family: var(--font);
  font-size: var(--fs-body);
  line-height: 1.6;
  font-optical-sizing: auto;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  text-rendering: optimizeLegibility;
  overflow-x: hidden;
}
img, svg, canvas { display: block; max-width: 100%; }
a { color: inherit; text-decoration: none; }
button { font: inherit; color: inherit; background: none; border: 0; padding: 0; cursor: pointer; }
h1, h2, h3, h4, p, ul, ol, dl, dd, figure { margin: 0; }
ul, ol { padding: 0; list-style: none; }
h1, h2, h3, h4 { font-weight: 500; text-wrap: balance; }
p { text-wrap: pretty; }
::selection { background: var(--brand); color: #fff; }
:focus-visible { outline: 2px solid var(--brand); outline-offset: 3px; border-radius: 4px; }
.sr-only { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0; }
.skip { position: fixed; left: 12px; top: -60px; z-index: 300; background: var(--ink); color: #fff; padding: 10px 16px; border-radius: var(--r-sm); }
.skip:focus { top: 12px; }

/* ---------- layout ---------- */
.wrap { width: 100%; max-width: var(--max); margin-inline: auto; padding-inline: var(--gutter); }
.grid { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); column-gap: clamp(16px, 2vw, 32px); }
.section { padding-block: var(--section); }
.section--tight { padding-block: clamp(64px, 8vw, 120px); }
.rule { height: 1px; background: var(--line); border: 0; margin: 0; }

/* ---------- type ---------- */
.display { font-size: var(--fs-display); line-height: .94; letter-spacing: -0.048em; font-weight: 500; }
.h1 { font-size: var(--fs-h1); line-height: .98; letter-spacing: -0.042em; font-weight: 500; }
.h2 { font-size: var(--fs-h2); line-height: 1.02; letter-spacing: -0.035em; font-weight: 500; }
.h3 { font-size: var(--fs-h3); line-height: 1.2; letter-spacing: -0.018em; font-weight: 500; }
.lead { font-size: var(--fs-lead); line-height: 1.32; letter-spacing: -0.018em; color: var(--ink); font-weight: 400; }
.body-l { font-size: 1.1875rem; line-height: 1.6; color: var(--ink-2); max-width: 60ch; }
.muted { color: var(--ink-2); }
.small { font-size: var(--fs-small); }
.tag { display: inline-flex; align-items: center; gap: 8px; font-size: var(--fs-small); color: var(--ink-2); }
.tag::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); }
.num { font-variant-numeric: tabular-nums; }
.blue { color: var(--brand); }

/* ---------- link + button ---------- */
.link {
  position: relative; display: inline-flex; align-items: center; gap: 10px;
  font-weight: 500; color: var(--ink);
  background: linear-gradient(currentColor, currentColor) 0 100% / 0 1px no-repeat;
  transition: background-size .5s var(--ease-out), color .3s;
  padding-bottom: 2px;
}
.link:hover { background-size: 100% 1px; color: var(--brand); }
.link--under { background-size: 100% 1px; }
.link--under:hover { animation: relink .7s var(--ease-out); }
@keyframes relink { 0% { background-position: 100% 100%; background-size: 100% 1px; } 50% { background-position: 100% 100%; background-size: 0 1px; } 51% { background-position: 0 100%; } 100% { background-position: 0 100%; background-size: 100% 1px; } }

.btn {
  --bg: var(--brand); --fg: #fff; --fill: var(--ink);
  position: relative; isolation: isolate; overflow: hidden;
  display: inline-flex; align-items: center; gap: 14px;
  height: 56px; padding: 0 10px 0 26px; border-radius: 999px;
  background: var(--bg); color: var(--fg);
  font-weight: 500; font-size: 1rem; letter-spacing: -0.01em;
  transition: color .45s var(--ease-out);
  will-change: transform;
}
.btn::before {
  content: ""; position: absolute; inset: 0; z-index: -1; border-radius: inherit;
  background: var(--fill);
  transform: translateY(101%); transition: transform .6s var(--ease-out);
}
.btn:hover::before { transform: translateY(0); }
.btn .btn-ic {
  width: 38px; height: 38px; border-radius: 50%; display: grid; place-items: center;
  background: rgba(255,255,255,.14); overflow: hidden; position: relative;
}
.btn .btn-ic svg { width: 14px; height: 14px; transition: transform .6s var(--ease-out); }
.btn .btn-ic svg + svg { position: absolute; transform: translate(-200%, 200%); }
.btn:hover .btn-ic svg:first-child { transform: translate(200%, -200%); }
.btn:hover .btn-ic svg + svg { transform: translate(0, 0); }
.btn--ghost { --bg: transparent; --fg: var(--ink); --fill: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
.btn--ghost:hover { --fg: #fff; color: #fff; }
.btn--ghost .btn-ic { background: var(--wash); }
.btn--ghost:hover .btn-ic { background: rgba(255,255,255,.14); }
.btn--white { --bg: #fff; --fg: var(--brand); --fill: var(--ink); }
.btn--white:hover { color: #fff; }
.btn--white .btn-ic { background: var(--brand-tint); }
.btn--white:hover .btn-ic { background: rgba(255,255,255,.14); }
.btn--sm { height: 46px; padding: 0 8px 0 20px; font-size: .9375rem; gap: 10px; }
.btn--sm .btn-ic { width: 32px; height: 32px; }
.magnetic { display: inline-block; }

/* ---------- nav ---------- */
.nav {
  position: fixed; inset: 0 0 auto 0; z-index: 100; height: var(--nav-h);
  transition: transform .6s var(--ease-out), background-color .4s, box-shadow .4s;
}
.nav.is-scrolled { background: rgba(255,255,255,.86); -webkit-backdrop-filter: saturate(160%) blur(14px); backdrop-filter: saturate(160%) blur(14px); box-shadow: 0 1px 0 var(--line); }
.nav.is-hidden { transform: translateY(-100%); }
.nav-inner { height: 100%; display: flex; align-items: center; justify-content: space-between; gap: 24px; }
.logo { display: inline-flex; align-items: center; }
.logo img { height: 34px; width: auto; display: block; }
.footer .logo img { height: 40px; }
.loader-logo { height: 44px; width: auto; margin-bottom: auto; align-self: flex-start; }
.nav-links { display: flex; align-items: center; gap: 4px; }
.nav-link {
  position: relative; display: inline-flex; align-items: center; gap: 6px; height: 40px; padding: 0 14px; border-radius: 999px;
  font-size: .9688rem; font-weight: 500; color: var(--ink); transition: background-color .3s, color .3s;
}
.nav-link:hover, .nav-link[aria-expanded="true"] { background: var(--wash); }
.nav-link[aria-current="page"] { color: var(--brand); }
.nav-link .chev { width: 10px; height: 10px; transition: transform .4s var(--ease-out); }
.nav-link[aria-expanded="true"] .chev { transform: rotate(180deg); }
.nav-right { display: flex; align-items: center; gap: 10px; }
.burger { display: none; width: 46px; height: 46px; border-radius: 50%; background: var(--wash); position: relative; }
.burger span { position: absolute; left: 14px; right: 14px; height: 1.5px; background: var(--ink); transition: transform .5s var(--ease-out), top .5s var(--ease-out); }
.burger span:nth-child(1) { top: 19px; } .burger span:nth-child(2) { top: 26px; }
.menu-open .burger span:nth-child(1) { top: 22.5px; transform: rotate(45deg); }
.menu-open .burger span:nth-child(2) { top: 22.5px; transform: rotate(-45deg); }

/* mega menu */
.mega {
  position: fixed; left: 0; right: 0; top: var(--nav-h); z-index: 99;
  background: #fff; box-shadow: 0 1px 0 var(--line), 0 30px 60px -30px rgba(11,29,38,.18);
  clip-path: inset(0 0 100% 0); visibility: hidden;
  transition: clip-path .6s var(--ease-out), visibility 0s linear .6s;
}
.mega.is-open { clip-path: inset(0 0 0 0); visibility: visible; transition: clip-path .6s var(--ease-out), visibility 0s; }
.mega-inner { padding-block: 40px 48px; display: grid; grid-template-columns: 1.1fr repeat(3, 1fr); gap: 40px; }
.mega-intro p { color: var(--ink-2); font-size: .9688rem; max-width: 30ch; margin-top: 12px; }
.mega-col h3 { font-size: .875rem; color: var(--ink-3); font-weight: 500; margin-bottom: 14px; }
.mega-col h3 a:hover { color: var(--brand); }
.mega-col li a { display: block; padding: 7px 0; font-size: 1.0625rem; font-weight: 500; letter-spacing: -0.01em; transition: color .25s, transform .4s var(--ease-out); }
.mega-col li a:hover { color: var(--brand); transform: translateX(4px); }
.mega > *, .mega-col li { opacity: 0; transform: translateY(10px); transition: opacity .4s, transform .6s var(--ease-out); }
.mega.is-open > *, .mega.is-open .mega-col li { opacity: 1; transform: none; }
.mega.is-open .mega-col li { transition-delay: calc(var(--i, 0) * 30ms + 80ms); }

/* mobile menu */
.mmenu {
  position: fixed; inset: 0; z-index: 98; background: #fff; padding: calc(var(--nav-h) + 24px) var(--gutter) 32px;
  display: flex; flex-direction: column; overflow-y: auto;
  clip-path: inset(0 0 100% 0); visibility: hidden;
  transition: clip-path .7s var(--ease-io), visibility 0s linear .7s;
}
.menu-open .mmenu { clip-path: inset(0 0 0 0); visibility: visible; transition: clip-path .7s var(--ease-io), visibility 0s; }
.mmenu-list > li { border-bottom: 1px solid var(--line); overflow: hidden; }
.mmenu-list > li > a, .mmenu-list > li > button { display: flex; width: 100%; justify-content: space-between; align-items: center; padding: 12px 0; font-size: clamp(1.25rem, 5.4vw, 1.6rem); font-weight: 500; letter-spacing: -0.035em; text-align: left; }
.mmenu-list > li > * { transform: translateY(110%); transition: transform .8s var(--ease-out); }
.menu-open .mmenu-list > li > * { transform: none; transition-delay: calc(var(--i) * 50ms + 200ms); }
#mm-svc svg { transition: transform .5s var(--ease-out); }
#mm-svc[aria-expanded="true"] svg { transform: rotate(45deg); }
.mmenu-sub { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .5s var(--ease-out); }
.mmenu-sub > div { overflow: hidden; }
.mmenu-sub.is-open { grid-template-rows: 1fr; }
.mmenu-sub h4 { font-size: .8125rem; color: var(--ink-3); font-weight: 500; margin: 12px 0 4px; }
.mmenu-sub a { display: block; padding: 6px 0; font-size: 1.0625rem; font-weight: 500; }
.mmenu-sub > div > div { padding-bottom: 18px; }
.mmenu-foot { margin-top: auto; padding-top: 32px; display: grid; gap: 6px; color: var(--ink-2); font-size: .9375rem; }

/* ---------- page transition + loader ---------- */
.curtain { position: fixed; inset: 0; z-index: 200; pointer-events: none; }
.curtain i { position: absolute; inset: 0; background: var(--brand); transform: translateY(100%); }
.curtain i + i { background: var(--paper); }
.curtain.is-in i { transform: translateY(0); transition: transform .62s var(--ease-io); }
.curtain.is-in i + i { transition-delay: .06s; }
.curtain.is-out i { transform: translateY(-100%); transition: transform .7s var(--ease-io); }
.curtain.is-out i:first-child { transition-delay: .08s; }
.curtain-label { position: absolute; left: var(--gutter); bottom: 32px; z-index: 2; color: var(--ink); font-size: clamp(2rem, 5vw, 4rem); font-weight: 500; letter-spacing: -0.04em; opacity: 0; transition: opacity .3s; }
.curtain.is-in .curtain-label { opacity: 1; transition-delay: .35s; }
.curtain.is-out .curtain-label { opacity: 0; transition-delay: 0s; }

.loader { position: fixed; inset: 0; z-index: 250; background: var(--paper); display: flex; flex-direction: column; justify-content: flex-end; padding: var(--gutter); transition: transform 1s var(--ease-io); }
.loader.is-done { transform: translateY(-100%); }
.loader-num { font-size: clamp(5rem, 20vw, 17rem); line-height: .8; font-weight: 500; letter-spacing: -0.06em; color: var(--ink); font-variant-numeric: tabular-nums; display: flex; align-items: baseline; gap: .12em; }
.loader-num small { font-size: .22em; letter-spacing: -0.02em; color: var(--brand); }
.loader-bar { height: 2px; background: var(--line); margin-top: 28px; position: relative; overflow: hidden; }
.loader-bar i { position: absolute; inset: 0; background: var(--brand); transform-origin: left; transform: scaleX(0); }
.loader-meta { display: flex; justify-content: space-between; margin-top: 14px; font-size: var(--fs-small); color: var(--ink-2); }

/* ---------- cursor ---------- */
.cursor { position: fixed; left: 0; top: 0; z-index: 400; pointer-events: none; mix-blend-mode: normal; }
.cursor-dot { position: absolute; width: 8px; height: 8px; margin: -4px 0 0 -4px; border-radius: 50%; background: var(--brand); transition: transform .3s var(--ease-out), opacity .3s; }
.cursor-ring { position: absolute; width: 84px; height: 84px; margin: -42px 0 0 -42px; border-radius: 50%; background: var(--brand); color: #fff; display: grid; place-items: center; font-size: .8125rem; font-weight: 500; transform: scale(0); transition: transform .5s var(--ease-out); }
.cursor.is-label .cursor-ring { transform: scale(1); }
.cursor.is-label .cursor-dot { opacity: 0; }
.cursor.is-hover .cursor-dot { transform: scale(3.2); opacity: .18; }
@media (pointer: coarse) { .cursor { display: none; } }

/* ---------- reveal primitives ---------- */
.js .split .w { display: inline-block; overflow: hidden; vertical-align: top; padding: .14em .04em .2em; margin: -.14em -.04em -.2em; }
.js .split.is-done .w { overflow: visible; }
.js .split .wi { display: inline-block; transform: translateY(105%); transition: transform 1.1s var(--ease-out); transition-delay: calc(var(--d, 0) * 1s); }
.js .split.is-in .wi { transform: none; }
.js [data-reveal] { opacity: 0; transform: translateY(28px); transition: opacity 1s var(--ease-out), transform 1.2s var(--ease-out); transition-delay: var(--delay, 0s); }
.js [data-reveal].is-in { opacity: 1; transform: none; }
.js .draw [pathLength] { stroke-dasharray: 1; stroke-dashoffset: 1; }
.js .draw.is-drawn [pathLength] { stroke-dashoffset: 0; }

/* ---------- hero: inset ocean card ---------- */
.hero { padding: 10px; position: relative; }
.hero-card {
  position: relative; overflow: hidden; border-radius: var(--r-lg);
  height: calc(100svh - 20px); min-height: 660px; max-height: 1040px;
  background: linear-gradient(180deg, #F2F7F8 0 54%, #0B4B5E 54% 100%);
  transform-origin: 50% 0; will-change: transform;
}
.hero-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
.hero-card::after { content: ""; position: absolute; inset: 0; pointer-events: none; z-index: 1; background: linear-gradient(180deg, transparent 56%, rgba(3,34,44,.18) 70%, rgba(3,30,40,.5) 100%); }
.hero-ship { position: absolute; left: 53%; mix-blend-mode: multiply; opacity: .92; width: clamp(360px, 40vw, 760px); height: auto; pointer-events: none; animation: bob 8s ease-in-out infinite; transform-origin: 50% 90%; }
@keyframes bob { 0%, 100% { transform: translateY(0) rotate(0deg); } 50% { transform: translateY(3px) rotate(.25deg); } }
.hero-inner { position: absolute; inset: 0; z-index: 2; display: flex; flex-direction: column; padding-top: calc(var(--nav-h) + clamp(36px, 6vw, 84px)); pointer-events: none; }
.hero-inner a, .hero-inner button { pointer-events: auto; }
.hero-title { max-width: 18ch; color: var(--ink); position: relative; z-index: 1; }
.hero-bottom { margin-top: auto; display: grid; grid-template-columns: minmax(0, 1fr) auto; align-items: end; gap: 32px; padding-bottom: clamp(26px, 3vw, 40px); }
.hero-sub { max-width: 46ch; font-size: clamp(1.0625rem, 1.3vw, 1.25rem); color: rgba(255,255,255,.92); text-shadow: 0 1px 18px rgba(3,30,40,.35); line-height: 1.55; }
.hero-cta { display: flex; flex-wrap: wrap; gap: 12px; }
.hero-foot { display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 24px; padding-block: 18px 22px; border-top: 1px solid rgba(255,255,255,.22); color: #fff; }
.ticker { position: relative; height: 3.2em; overflow: hidden; max-width: 60ch; font-size: .9375rem; pointer-events: auto; }
.ticker-item { position: absolute; inset: 0; display: flex; gap: 14px; align-items: center; transform: translateY(100%); opacity: 0; transition: transform .9s var(--ease-out), opacity .6s; color: rgba(255,255,255,.86); }
.ticker-item.is-active { transform: none; opacity: 1; }
.ticker-item.is-leaving { transform: translateY(-100%); opacity: 0; }
.ticker-count { color: #fff; font-weight: 500; white-space: nowrap; font-variant-numeric: tabular-nums; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.14); font-size: .8125rem; }
.ticker-item a { color: #fff; }
.hero-scroll { display: inline-flex; align-items: center; gap: 12px; font-size: .875rem; color: rgba(255,255,255,.8); }
.hero-scroll i { width: 26px; height: 40px; border-radius: 20px; border: 1.5px solid rgba(255,255,255,.55); position: relative; }
.hero-scroll i::after { content: ""; position: absolute; left: 50%; top: 8px; width: 3px; height: 7px; margin-left: -1.5px; border-radius: 2px; background: #fff; animation: wheel 1.8s var(--ease-out) infinite; }
@keyframes wheel { 0% { transform: translateY(0); opacity: 1; } 80% { transform: translateY(12px); opacity: 0; } 100% { opacity: 0; } }
.btn--glass { --bg: rgba(255,255,255,.1); --fg: #fff; --fill: #fff; box-shadow: inset 0 0 0 1px rgba(255,255,255,.4); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); }
.btn--glass:hover { color: var(--brand); }
.btn--glass .btn-ic { background: rgba(255,255,255,.16); }
.btn--glass:hover .btn-ic { background: var(--brand-tint); }

/* ---------- marquee ---------- */
.marquee { border-block: 1px solid var(--line); overflow: hidden; padding-block: 22px; }
.marquee-track { display: flex; width: max-content; animation: marq 48s linear infinite; }
.marquee:hover .marquee-track { animation-play-state: paused; }
.marquee-track span { display: inline-flex; align-items: center; gap: 36px; padding-right: 36px; font-size: clamp(1.25rem, 2.2vw, 1.875rem); font-weight: 500; letter-spacing: -0.025em; white-space: nowrap; }
.marquee-track span::after { content: ""; width: 9px; height: 9px; border: 1.5px solid var(--brand); border-radius: 50%; }
@keyframes marq { to { transform: translateX(-50%); } }

/* ---------- intro statement ---------- */
.statement { font-size: clamp(1.6rem, 4.3vw, 5.4rem); line-height: 1.1; letter-spacing: -0.035em; font-weight: 500; max-width: none; text-wrap: pretty; }
.statement .sw { color: var(--ink); opacity: var(--o, .16); transition: opacity .2s linear; }
.facts { margin-top: clamp(64px, 8vw, 120px); display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); border-top: 1px solid var(--line); }
.fact { padding: 28px 24px 0 0; display: flex; flex-direction: column; gap: 10px; }
.fact + .fact { padding-left: 24px; border-left: 1px solid var(--line); }
.fact-n { font-size: clamp(2.6rem, 4.6vw, 4.5rem); font-weight: 500; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.fact-n sup { font-size: .45em; color: var(--brand); vertical-align: top; position: relative; top: .25em; margin-left: .05em; }
.fact p { color: var(--ink-2); font-size: .9688rem; max-width: 26ch; }

/* ---------- section heads ---------- */
.shead { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); column-gap: clamp(16px, 2vw, 32px); align-items: end; margin-bottom: clamp(48px, 6vw, 88px); }
.shead > :first-child { grid-column: 1 / span 7; }
.shead > :last-child:not(:first-child) { grid-column: 9 / span 4; color: var(--ink-2); }
.shead .tag { margin-bottom: 22px; }

/* ---------- services index ---------- */
.sindex { border-top: 1px solid var(--ink); }
.srow { border-bottom: 1px solid var(--line); position: relative; }
.srow-head {
  width: 100%; display: grid; grid-template-columns: 90px 1fr auto 56px; align-items: center; gap: 24px;
  padding: clamp(26px, 3vw, 40px) 0; text-align: left; position: relative;
}
.srow-head::before { content: ""; position: absolute; inset: 0; background: var(--wash); transform: scaleY(0); transform-origin: bottom; transition: transform .6s var(--ease-out); z-index: -1; }
.srow:hover .srow-head::before, .srow.is-open .srow-head::before { transform: scaleY(1); }
.srow-idx { font-size: var(--fs-small); color: var(--ink-3); font-variant-numeric: tabular-nums; padding-left: 4px; }
.srow-title { font-size: clamp(1.9rem, 4.2vw, 4rem); font-weight: 500; letter-spacing: -0.04em; line-height: 1; transition: transform .7s var(--ease-out), color .3s; }
.srow:hover .srow-title { transform: translateX(14px); }
.srow.is-open .srow-title { color: var(--brand); }
.srow-count { font-size: var(--fs-small); color: var(--ink-2); }
.srow-toggle { width: 48px; height: 48px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background-color .4s, border-color .4s, transform .6s var(--ease-out); background: #fff; }
.srow-toggle svg { width: 14px; height: 14px; }
.srow.is-open .srow-toggle { background: var(--brand); border-color: var(--brand); color: #fff; transform: rotate(45deg); }
.srow-body { display: grid; grid-template-rows: 0fr; transition: grid-template-rows .7s var(--ease-out); }
.srow.is-open .srow-body { grid-template-rows: 1fr; }
.srow-body > div { overflow: hidden; }
.srow-inner { display: grid; grid-template-columns: 90px 1fr 1fr; gap: 24px; padding: 4px 0 44px; }
.srow-inner p { grid-column: 2; color: var(--ink-2); max-width: 46ch; }
.srow-inner p + .link { margin-top: 18px; }
.srow-links { grid-column: 3; display: grid; }
.srow-links a { display: flex; justify-content: space-between; align-items: center; padding: 13px 0; border-bottom: 1px solid var(--line); font-weight: 500; transition: color .3s, padding .5s var(--ease-out); }
.srow-links a:first-child { border-top: 1px solid var(--line); }
.srow-links a:hover { color: var(--brand); padding-left: 8px; }
.srow-links svg { width: 12px; height: 12px; opacity: .5; }
.preview { position: fixed; left: 0; top: 0; z-index: 50; width: 340px; aspect-ratio: 4 / 3; pointer-events: none; border-radius: var(--r-md); overflow: hidden; background: var(--brand); color: #fff; transform: translate(-50%, -50%) scale(0); transition: transform .5s var(--ease-out); }
.preview.is-on { transform: translate(-50%, -50%) scale(1); }
.preview svg { width: 100%; height: 100%; }
.preview-label { position: absolute; left: 16px; bottom: 12px; font-size: .8125rem; opacity: .8; }

/* ---------- horizontal capabilities ---------- */
.hs { position: relative; }
.hs-sticky { position: sticky; top: 0; height: 100svh; overflow: hidden; display: flex; flex-direction: column; justify-content: center; }
.hs-top { display: flex; justify-content: space-between; align-items: end; gap: 24px; margin-bottom: clamp(28px, 4vh, 48px); }
.hs-progress { width: 180px; height: 2px; background: var(--line); position: relative; overflow: hidden; flex: none; }
.hs-progress i { position: absolute; inset: 0; background: var(--brand); transform-origin: left; transform: scaleX(var(--p, 0)); }
.hs-track { display: flex; gap: clamp(16px, 2vw, 28px); padding-inline: var(--gutter); will-change: transform; }
.cap {
  flex: none; width: clamp(300px, 34vw, 520px); height: min(62svh, 600px); border-radius: var(--r-lg);
  background: var(--wash); padding: clamp(24px, 2.4vw, 36px); display: flex; flex-direction: column; position: relative; overflow: hidden;
  transition: background-color .6s var(--ease-out), color .6s var(--ease-out);
}
.cap:hover { background: var(--brand); color: #fff; }
.cap:hover .cap-art { color: #fff; }
.cap:hover p { color: rgba(255,255,255,.82); }
.cap-top { display: flex; justify-content: space-between; align-items: start; gap: 16px; }
.cap h3 { font-size: clamp(1.6rem, 2.3vw, 2.25rem); letter-spacing: -0.035em; line-height: 1.05; max-width: 12ch; }
.cap-go { width: 48px; height: 48px; border-radius: 50%; background: #fff; color: var(--ink); display: grid; place-items: center; flex: none; transition: transform .6s var(--ease-out); }
.cap-go svg { width: 14px; height: 14px; }
.cap:hover .cap-go { transform: rotate(-45deg); }
.cap-art { flex: 1; color: var(--brand); display: grid; place-items: center; padding-block: 18px; min-height: 0; transition: color .6s; }
.cap-art svg { width: 100%; height: 100%; max-height: 240px; }
.cap p { color: var(--ink-2); font-size: .9688rem; max-width: 40ch; transition: color .6s; }
.cap-end { width: clamp(280px, 26vw, 400px); background: transparent; border: 1px solid var(--line); justify-content: space-between; }
.cap-end:hover { background: var(--ink); border-color: var(--ink); }

/* ---------- process (true sequence) ---------- */
.process { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 0; position: relative; }
.process-line { position: absolute; left: 0; right: 0; top: 0; height: 2px; background: var(--line); }
.process-line i { position: absolute; inset: 0; background: var(--brand); transform-origin: left; transform: scaleX(var(--p, 0)); }
.step { padding: 40px 28px 0 0; position: relative; }
.step + .step { padding-left: 28px; }
.step::before { content: ""; position: absolute; top: -5px; left: 0; width: 12px; height: 12px; border-radius: 50%; background: #fff; border: 2px solid var(--brand); }
.step + .step::before { left: 28px; }
.step-n { font-size: var(--fs-small); color: var(--brand); font-weight: 500; font-variant-numeric: tabular-nums; }
.step h3 { margin: 10px 0 14px; }
.step p { color: var(--ink-2); max-width: 36ch; font-size: .9688rem; }
.step ul { margin-top: 20px; display: grid; gap: 8px; }
.step li { font-size: .9375rem; display: flex; gap: 10px; }
.step li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--ink-3); margin-top: .62em; flex: none; }

/* ---------- blue band (green services) ---------- */
.band { background: var(--brand); color: #fff; border-radius: var(--r-lg); margin-inline: clamp(8px, 1.4vw, 20px); overflow: hidden; position: relative; }
.band .tag { color: rgba(255,255,255,.8); }
.band .tag::before { background: #fff; }
.band-grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); column-gap: clamp(16px, 2vw, 32px); row-gap: 56px; }
.band-big { font-size: clamp(5rem, 15vw, 15rem); line-height: .82; letter-spacing: -0.065em; font-weight: 500; }
.band-big small { display: block; font-size: .13em; letter-spacing: -0.02em; line-height: 1.3; margin-top: 1.3em; max-width: 26ch; color: rgba(255,255,255,.82); font-weight: 400; }
.band-list { grid-column: 8 / span 5; align-self: end; }
.band-list li { display: grid; grid-template-columns: 1fr auto; gap: 16px; padding: 18px 0; border-top: 1px solid rgba(255,255,255,.22); align-items: baseline; }
.band-list li:last-child { border-bottom: 1px solid rgba(255,255,255,.22); }
.band-list b { font-weight: 500; font-size: 1.125rem; letter-spacing: -0.01em; }
.band-list li span { font-size: .875rem; color: rgba(255,255,255,.72); text-align: right; }
.band-waves { position: absolute; inset: auto 0 0 0; height: 40%; opacity: .16; pointer-events: none; }

/* ---------- projects ---------- */
.plist { border-top: 1px solid var(--ink); }
.prow { display: grid; grid-template-columns: 1.4fr 1fr 1fr 48px; gap: 24px; align-items: center; padding: 30px 0; border-bottom: 1px solid var(--line); position: relative; }
.prow h3 { font-size: clamp(1.4rem, 2.4vw, 2.25rem); letter-spacing: -0.035em; transition: transform .7s var(--ease-out), color .3s; }
.prow:hover h3 { transform: translateX(12px); color: var(--brand); }
.prow .muted { font-size: .9688rem; }
.prow-go { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background-color .4s, color .4s, border-color .4s; }
.prow-go svg { width: 13px; height: 13px; }
.prow:hover .prow-go { background: var(--brand); border-color: var(--brand); color: #fff; }
.pgrid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: clamp(16px, 2vw, 28px); }
.pcard { display: flex; flex-direction: column; gap: 18px; }
.pcard-media { aspect-ratio: 4 / 3; border-radius: var(--r-lg); background: var(--wash); color: var(--brand); overflow: hidden; position: relative; display: grid; place-items: center; }
.pcard-media svg { width: 78%; height: 78%; transition: transform 1.2s var(--ease-out); }
.pcard:hover .pcard-media svg { transform: scale(1.05); }
.pcard-media .slot { position: absolute; left: 16px; bottom: 14px; font-size: .78rem; color: var(--ink-3); }
.pcard-meta { display: flex; justify-content: space-between; gap: 16px; align-items: baseline; }
.pcard h3 { font-size: clamp(1.4rem, 2vw, 1.9rem); letter-spacing: -0.03em; }
.pill { display: inline-flex; height: 30px; align-items: center; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line); font-size: .8125rem; color: var(--ink-2); white-space: nowrap; }

/* ---------- offices ---------- */
.offices { display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); border-top: 1px solid var(--line); }
.office address { overflow-wrap: anywhere; }
.office .contact-lines a { overflow-wrap: anywhere; }
.office { padding: 28px 24px 8px 0; display: flex; flex-direction: column; gap: 14px; }
.office + .office { padding-left: 24px; border-left: 1px solid var(--line); }
.office-time { font-size: clamp(2.2rem, 3.6vw, 3.4rem); font-weight: 500; letter-spacing: -0.05em; line-height: 1; font-variant-numeric: tabular-nums; }
.office-time span { animation: blink 1s steps(1) infinite; }
@keyframes blink { 50% { opacity: .2; } }
.office h3 { font-size: 1.125rem; letter-spacing: -0.015em; }
.office address { font-style: normal; color: var(--ink-2); font-size: .9375rem; line-height: 1.55; }
.office .contact-lines { display: grid; gap: 2px; font-size: .9375rem; }
.office .contact-lines a:hover { color: var(--brand); }
.office-zone { font-size: .8125rem; color: var(--ink-3); }

/* ---------- CTA ---------- */
.cta { position: relative; overflow: hidden; }
.cta-title { font-size: clamp(3.4rem, 11vw, 11.5rem); line-height: .9; letter-spacing: -0.06em; font-weight: 500; }
.cta-row { margin-top: clamp(36px, 4vw, 56px); display: flex; flex-wrap: wrap; justify-content: space-between; align-items: end; gap: 32px; }
.cta-row p { max-width: 40ch; color: var(--ink-2); font-size: 1.125rem; }
.cta-mail { font-size: clamp(1.4rem, 2.6vw, 2.25rem); letter-spacing: -0.03em; font-weight: 500; }

/* ---------- footer ---------- */
.footer { padding-top: clamp(72px, 8vw, 120px); border-top: 1px solid var(--line); }
.footer-grid { display: grid; grid-template-columns: 1.4fr repeat(3, 1fr); gap: 40px; }
.footer-blurb { color: var(--ink-2); max-width: 34ch; margin-top: 18px; font-size: .9688rem; }
.footer h4 { font-size: .875rem; color: var(--ink-3); font-weight: 500; margin-bottom: 16px; }
.footer li { padding: 4px 0; }
.footer li a { transition: color .25s; }
.footer li a:hover { color: var(--brand); }
.footer .addr { color: var(--ink-2); font-size: .9375rem; }
.footer-word { margin-top: clamp(56px, 7vw, 100px); overflow: hidden; user-select: none; }
.footer-word img { width: 100%; height: auto; display: block; transform: translateY(var(--y, 0%)); will-change: transform; }
.footer-bar { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 16px; padding-block: 26px; margin-top: 28px; border-top: 1px solid var(--line); font-size: var(--fs-small); color: var(--ink-2); }
.footer-bar nav { display: flex; gap: 22px; flex-wrap: wrap; }
.footer-bar a:hover { color: var(--brand); }
.socials { display: flex; gap: 8px; margin-top: 24px; }
.socials a { width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); display: grid; place-items: center; transition: background-color .35s, color .35s, border-color .35s; }
.socials a:hover { background: var(--brand); border-color: var(--brand); color: #fff; }
.socials svg { width: 16px; height: 16px; }

/* ---------- inner pages ---------- */
.phero { padding-top: calc(var(--nav-h) + clamp(56px, 9vw, 140px)); padding-bottom: clamp(56px, 7vw, 100px); position: relative; }
.crumbs { display: flex; flex-wrap: wrap; gap: 8px; font-size: var(--fs-small); color: var(--ink-3); margin-bottom: 28px; }
.crumbs a:hover { color: var(--brand); }
.crumbs span::before { content: "/"; margin-right: 8px; color: var(--line); }
.phero-grid { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); column-gap: clamp(16px, 2vw, 32px); row-gap: 32px; align-items: end; }
.phero-grid > h1 { grid-column: 1 / span 8; }
.phero-grid > .phero-aside { grid-column: 9 / span 4; color: var(--ink-2); font-size: 1.0625rem; }
.phero-art { margin-top: clamp(48px, 6vw, 88px); border-radius: var(--r-lg); background: var(--wash); color: var(--brand); aspect-ratio: 21 / 8; display: grid; place-items: center; overflow: hidden; position: relative; }
.phero-art svg { width: 86%; height: 82%; }
.phero-art .coord { position: absolute; font-size: .75rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }

.split2 { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); column-gap: clamp(16px, 2vw, 32px); row-gap: 28px; }
.split2 > .s-l { grid-column: 1 / span 4; }
.split2 > .s-r { grid-column: 6 / span 7; }
.sticky-l { position: sticky; top: calc(var(--nav-h) + 32px); align-self: start; }

.block { padding-block: clamp(44px, 5vw, 72px); border-top: 1px solid var(--line); }
.block:first-child { border-top: 1px solid var(--ink); }
.block-head { display: flex; justify-content: space-between; gap: 24px; align-items: baseline; margin-bottom: 14px; }
.block-head .small { color: var(--ink-3); font-variant-numeric: tabular-nums; white-space: nowrap; }
.block > p { color: var(--ink-2); max-width: 60ch; margin-bottom: 26px; }
.checks { columns: 2; column-gap: 40px; }
.checks li { break-inside: avoid; display: flex; gap: 12px; padding: 9px 0; font-size: .9688rem; border-bottom: 1px solid var(--line); }
.checks li::before { content: ""; flex: none; width: 14px; height: 14px; margin-top: .3em; border-radius: 50%; border: 1.5px solid var(--brand); background: radial-gradient(circle, var(--brand) 0 2.5px, transparent 3px); }
.sub-h { font-size: 1rem; font-weight: 600; margin: 26px 0 6px; letter-spacing: -0.01em; }
.sub-h:first-of-type { margin-top: 0; }
.defs { display: grid; gap: 0; }
.defs > div { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.4fr); gap: 24px; padding: 18px 0; border-bottom: 1px solid var(--line); }
.defs dt { font-weight: 500; }
.defs dd { color: var(--ink-2); font-size: .9688rem; }

.side-nav { display: grid; gap: 2px; margin-top: 28px; max-width: 300px; }
.side-nav a { display: flex; justify-content: space-between; padding: 8px 0; font-size: .9375rem; color: var(--ink-2); border-bottom: 1px solid transparent; transition: color .25s; }
.side-nav a:hover, .side-nav a.is-active { color: var(--brand); }
.side-nav a.is-active::after { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--brand); align-self: center; }

.related { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: clamp(16px, 2vw, 28px); }
.rcard { padding: 28px; border-radius: var(--r-md); border: 1px solid var(--line); display: flex; flex-direction: column; gap: 34px; min-height: 220px; justify-content: space-between; transition: border-color .4s, background-color .4s; }
.rcard:hover { border-color: var(--brand); background: var(--brand-tint); }
.rcard h3 { font-size: 1.375rem; letter-spacing: -0.025em; }
.rcard .small { color: var(--ink-2); }
.rcard-art { color: var(--brand); height: 90px; }
.rcard-art svg { height: 100%; width: auto; }

.areas { display: grid; gap: clamp(72px, 9vw, 140px); }
.area { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); column-gap: clamp(16px, 2vw, 32px); row-gap: 32px; }
.area-l { grid-column: 1 / span 5; }
.area-r { grid-column: 7 / span 6; }
.area-art { margin-top: 32px; aspect-ratio: 4/3; border-radius: var(--r-lg); background: var(--wash); color: var(--brand); display: grid; place-items: center; }
.area-art svg { width: 80%; height: 80%; }
.area-list > a, .svc-row > a { display: grid; grid-template-columns: 1fr auto; gap: 16px; align-items: center; padding: 22px 0; border-bottom: 1px solid var(--line); transition: padding .5s var(--ease-out), color .3s; }
.area-list > a:first-child, .area-list > .svc-row:first-child > a { border-top: 1px solid var(--ink); }
.area-list > a:hover, .svc-row > a:hover { padding-left: 10px; color: var(--brand); }
.area-list b { display: block; font-size: clamp(1.25rem, 1.8vw, 1.6rem); font-weight: 500; letter-spacing: -0.025em; }
.area-list span { color: var(--ink-2); font-size: .9375rem; }
.area-list svg { width: 14px; height: 14px; }

.team { display: grid; grid-template-columns: repeat(4, minmax(0,1fr)); gap: 0; border-top: 1px solid var(--line); }
.team > div { padding: 28px 24px 0 0; }
.team > div + div { padding-left: 24px; border-left: 1px solid var(--line); }
.team h3 { font-size: 1.25rem; letter-spacing: -0.02em; margin-bottom: 10px; }
.team p { font-size: .9375rem; color: var(--ink-2); }

.table { width: 100%; border-collapse: collapse; }
.table th, .table td { text-align: left; padding: 22px 16px 22px 0; border-bottom: 1px solid var(--line); vertical-align: top; }
.table th { font-size: .875rem; color: var(--ink-3); font-weight: 500; border-bottom-color: var(--ink); }
.table td:first-child { font-weight: 500; font-size: 1.0625rem; letter-spacing: -0.01em; }
.table td { color: var(--ink-2); }
.table td a { color: var(--brand); }
.table-wrap { overflow-x: auto; }

/* forms */
.form { display: grid; grid-template-columns: 1fr 1fr; gap: 28px 28px; }
.field { position: relative; display: grid; gap: 10px; }
.field--full { grid-column: 1 / -1; }
.field label { font-size: .9375rem; font-weight: 500; }
.field label em { font-style: normal; color: var(--ink-3); font-weight: 400; }
.field input, .field textarea, .field select {
  font: inherit; color: var(--ink); background: transparent; border: 0; border-bottom: 1px solid var(--line);
  padding: 10px 0 14px; border-radius: 0; outline: none; transition: border-color .3s; width: 100%; font-size: 1.125rem;
}
.field textarea { resize: vertical; min-height: 120px; line-height: 1.5; }
.field::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: 2px; background: var(--brand); transform: scaleX(0); transform-origin: left; transition: transform .6s var(--ease-out); }
.field:focus-within::after { transform: scaleX(1); }
.field.is-error::after { transform: scaleX(1); background: #C2322B; }
.field-err { font-size: .8125rem; color: #C2322B; min-height: 1em; }
.field-count { position: absolute; right: 0; top: 2px; font-size: .8125rem; color: var(--ink-3); font-variant-numeric: tabular-nums; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip input { position: absolute; opacity: 0; pointer-events: none; }
.chip span { display: inline-flex; height: 40px; align-items: center; padding: 0 16px; border-radius: 999px; border: 1px solid var(--line); font-size: .9375rem; cursor: pointer; transition: background-color .3s, color .3s, border-color .3s; }
.chip:hover span { border-color: var(--ink-3); }
.chip input:checked + span { background: var(--brand); border-color: var(--brand); color: #fff; }
.chip input:focus-visible + span { outline: 2px solid var(--brand); outline-offset: 2px; }
.form-done { padding: 32px; border-radius: var(--r-md); background: var(--brand-tint); display: grid; gap: 14px; }
.form-done pre { white-space: pre-wrap; font: inherit; font-size: .9375rem; color: var(--ink-2); background: #fff; padding: 16px; border-radius: var(--r-sm); margin: 0; max-height: 220px; overflow: auto; }

.notice { padding: 20px 22px; border-radius: var(--r-md); background: var(--wash); color: var(--ink-2); font-size: .9375rem; }
.doc-slot { aspect-ratio: 3 / 4; max-width: 520px; border-radius: var(--r-md); border: 1px dashed var(--ink-3); display: grid; place-items: center; color: var(--ink-3); font-size: .9375rem; text-align: center; padding: 24px; }
.prose h2 { font-size: 1.5rem; letter-spacing: -0.02em; margin: 44px 0 12px; }
.prose h2:first-child { margin-top: 0; }
.prose p, .prose li { color: var(--ink-2); max-width: 64ch; }
.prose ul { display: grid; gap: 6px; margin-top: 10px; }
.prose li { display: flex; gap: 10px; }
.prose li::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--brand); margin-top: .65em; flex: none; }


/* ---------- additions: sub-service chips, pager, filters, form states ---------- */
.svc-row { border-bottom: 1px solid var(--line); }
.svc-row > a { border-bottom: 0 !important; }
.subchips { display: flex; flex-wrap: wrap; gap: 8px; padding: 0 0 22px; margin-top: -6px; }
.pill--link { transition: background-color .3s, color .3s, border-color .3s; }
.pill--link:hover { background: var(--brand); border-color: var(--brand); color: #fff; }
.h2 a, .h3 a { transition: color .3s; }
.h2 a:hover, .h3 a:hover, .block-head a:hover { color: var(--brand); }
.pager { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: 48px; }
.pager a { display: grid; gap: 4px; padding: 22px; border-radius: var(--r-md); border: 1px solid var(--line); transition: border-color .3s, background-color .3s; }

.pf-link b:nth-of-type(1) { left: 0; } .pf-link b:nth-of-type(2) { left: 50%; } .pf-link b:nth-of-type(3) { left: 100%; }

.portfolios .pf:hover { box-shadow: 0 30px 60px -36px rgba(11,29,38,.4); }
.pf { border-radius: var(--r-lg); background: var(--wash); padding: clamp(20px, 2vw, 28px); display: flex; flex-direction: column; gap: 20px; }

/* vessel-type arc carousel */
.arc { position: relative; margin-inline: calc(50% - 50vw); }
.arc-stage { position: sticky; top: 0; height: 100svh; overflow: hidden; background: radial-gradient(70% 60% at 18% 50%, var(--brand-tint), transparent 70%); }
.arc-stage::before, .arc-stage::after { content: ""; position: absolute; left: 0; right: 0; height: 22%; z-index: 990; pointer-events: none; }
.arc-stage::before { top: 0; background: linear-gradient(#fff 8%, rgba(255,255,255,0)); }
.arc-stage::after { bottom: 0; background: linear-gradient(rgba(255,255,255,0), #fff 92%); }
.arc-card { position: absolute; left: 0; top: 0; border-radius: 18px; overflow: hidden; will-change: transform; cursor: pointer; box-shadow: 0 1px 2px rgba(11,29,38,.08), 0 24px 50px -18px rgba(11,29,38,.45); transition: filter .5s; }

.arc-card:not(.is-flat) { filter: saturate(.75) brightness(.96); }

.arc-art svg { width: 100%; height: 100%; }

.arc-h { margin-top: 16px; font-size: clamp(2.4rem, 4.6vw, 5rem); line-height: .98; letter-spacing: -0.045em; font-weight: 500; max-width: 13ch; text-wrap: balance; }
.arc-sub { margin-top: 18px; color: var(--ink-2); font-size: clamp(1rem, 1.15vw, 1.1875rem); max-width: 46ch; }
.arc-num { font-size: .875rem; color: var(--ink-3); font-variant-numeric: tabular-nums; margin-bottom: 10px; }
.arc-num b { color: var(--brand); font-weight: 600; }

/* ---------- same components on every screen: scale type and size, keep the behaviour ---------- */

  /* service panels: side by side, active one widens */

  .spanel-plus { position: static !important; margin: 0 !important; width: 32px; height: 32px; }

  /* growth timeline: sticky year on the left, as on desktop */

  .tl-side .tl-year { display: block !important; padding-left: 58px; font-size: clamp(1.4rem, 6.5vw, 2.6rem); }
  .tl-dot { left: 4px; }
  .tl-line { left: 23px; }
  .tl-body { padding-left: 0 !important; }

  .tl-text { font-size: .875rem; }
  .tl-art--2 { grid-template-columns: 1fr 1fr !important; gap: 8px; }
  /* ship design stages: three columns with a shared progress line */

  .process-line { display: block !important; }
  .step, .step + .step { padding: 30px 0 0 !important; border-left: 0 !important; }

  .step h3 { font-size: 1rem; }

}

/* spotlight hover for cards */
.spot { position: relative; isolation: isolate; }
.spot::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none; z-index: 2; opacity: 0; transition: opacity .4s;
  background: radial-gradient(380px circle at var(--mx, 50%) var(--my, 50%), rgba(26,127,153,.09), transparent 45%); }
.spot:hover::after { opacity: 1; }

/* bento */
.bento { display: grid; grid-template-columns: repeat(12, minmax(0,1fr)); grid-auto-rows: minmax(240px, auto); gap: clamp(12px, 1.4vw, 20px); margin-top: clamp(56px, 7vw, 104px); }
.tile { border-radius: var(--r-lg); background: var(--wash); padding: clamp(22px, 2.2vw, 32px); display: flex; flex-direction: column; justify-content: space-between; gap: 20px; overflow: hidden; position: relative; min-width: 0; }

.tile p { color: var(--ink-2); font-size: .9375rem; max-width: 36ch; }
.tile-globe { grid-column: span 6; grid-row: span 2; background: var(--wash); justify-content: flex-start; min-height: 560px; }
.globe-head { position: relative; z-index: 2; }

.globe-wrap canvas { width: 100%; height: 100%; display: block; cursor: grab; border-radius: 50%; }
.globe-pin { position: absolute; left: 0; top: 0; display: flex; align-items: center; gap: 7px; padding: 0; transition: opacity .3s; will-change: transform; }
.globe-pin i { width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 50%; background: var(--brand); box-shadow: 0 0 0 3px #fff, 0 4px 12px rgba(11,29,38,.25); position: relative; flex: none; transition: transform .3s var(--ease-out); }
.globe-pin i::after { content: ""; position: absolute; inset: -6px; border-radius: 50%; border: 1.5px solid var(--brand-logo); animation: pinpulse 2.2s var(--ease-out) infinite; }
@keyframes pinpulse { 0% { transform: scale(.5); opacity: .9; } 100% { transform: scale(1.9); opacity: 0; } }
.globe-pin span { margin-top: -7px; padding: 4px 10px; border-radius: 999px; background: var(--ink); color: #fff; font-size: .75rem; font-weight: 500; white-space: nowrap; transition: background-color .3s, transform .3s var(--ease-out); }
.globe-pin:hover span, .globe-pin:focus-visible span { background: var(--brand); }
.globe-pin.is-active i { transform: scale(1.25); }

.globe-pin.is-active span { background: var(--brand); }
.globe-card { position: absolute; left: clamp(16px, 2vw, 24px); bottom: clamp(16px, 2vw, 24px); z-index: 3; width: min(320px, calc(100% - 32px)); padding: 20px 22px; border-radius: 18px; background: rgba(255,255,255,.86); -webkit-backdrop-filter: blur(14px) saturate(160%); backdrop-filter: blur(14px) saturate(160%); box-shadow: 0 24px 60px -24px rgba(11,29,38,.35), inset 0 0 0 1px rgba(255,255,255,.6); opacity: 0; transform: translateY(12px) scale(.98); transition: opacity .4s, transform .5s var(--ease-out); }
.globe-card.is-open { opacity: 1; transform: none; }
.globe-card-role { font-size: .78rem; color: var(--brand); font-weight: 500; }

/* careers discipline grid */

.tl-art-tile { aspect-ratio: 4 / 3; border-radius: var(--r-md); display: grid; place-items: center; box-shadow: 0 24px 48px -32px rgba(11,29,38,.45); }

/* About: team + leadership */

.team-photo { margin: clamp(48px, 6vw, 80px) 0 0; position: relative; border-radius: var(--r-lg); overflow: hidden; aspect-ratio: 16 / 7; background: var(--wash); }
